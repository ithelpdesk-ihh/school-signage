<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Invictus Live Signage</title>

<style>

:root{
    --navy:#0f172a;
    --gold:#f59e0b;
    --bg:#020617;
    --white:#f8fafc;
    --soft:#e2e8f0;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:"Segoe UI",sans-serif;
    color:var(--white);
}

/* HEADER */
header{
    height:14vh;

    background:
    linear-gradient(
        90deg,
        var(--navy),
        #1e293b
    );

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 35px;

    border-bottom:5px solid var(--gold);

    box-shadow:
    0 4px 15px rgba(0,0,0,0.4);
}

/* BRAND GROUP */
.header-brand-group{
    display:flex;
    align-items:center;
    gap:22px;
    height:100%;
}

/* SCHOOL LOGO */
.school-logo{
    height:110%;
    width:auto;
    object-fit:contain;
}

/* SCHOOL TITLE */
.school-name{
    font-size:1.8rem;
    font-weight:900;
    letter-spacing:1px;
    line-height:1.2;
}

.school-name span{
    color:var(--gold);
    font-size:2.6rem;
}

/* CLOCK */
.clock-container{
    text-align:right;
}

#time{
    font-size:3.8rem;
    font-weight:900;
    line-height:1;
}

#date{
    color:var(--gold);
    font-size:1.1rem;
    margin-top:5px;
    letter-spacing:1px;
}

/* MAIN */
main{
    height:78vh;

    display:grid;

    grid-template-columns:
    1fr 1.6fr;

    gap:16px;

    padding:16px;
}

/* CARD */
.card{
    border-radius:18px;
    overflow:hidden;
    min-height:0;

    background:#111827;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

/* POSTER */
.poster-box{
    position:relative;
    border:2px solid rgba(255,255,255,0.08);
    background:#000;
}

/* RIGHT */
.right-col{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:0;
}

/* VIDEO */
.video-box{
    flex:2.2;
    position:relative;
    background:#000;
    border:2px solid rgba(255,255,255,0.08);
}

/* LOWER */
.bottom-split{
    flex:1.6;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:18px;

    min-height:0;
}

/* PANELS */
.info-panel{
    position:relative;
    overflow:hidden;

    border-radius:18px;

    padding:14px;

    backdrop-filter:blur(6px);

    border:2px solid rgba(255,255,255,0.08);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 10px 20px rgba(0,0,0,0.35);
}

/* PRIMARY */
.primary-panel{
    background:
    linear-gradient(
        145deg,
        #0f172a 0%,
        #162238 65%,
        #f59e0b 100%
    );
}

/* SECONDARY */
.secondary-panel{
    background:
    linear-gradient(
        145deg,
        #f59e0b 0%,
        #d48a08 60%,
        #0f172a 100%
    );
}

/* PANEL HEADER */
.panel-header{
    position:relative;
    z-index:2;
}

.panel-header h2{
    font-size:1.2rem;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:10px;
}

/* DIVIDER */
.panel-divider{
    width:100%;
    height:4px;

    border-radius:10px;

    background:
    linear-gradient(
        90deg,
        #000,
        rgba(0,0,0,0.4)
    );

    margin-bottom:12px;
}

/* SCROLL */
.scroll-container{
    position:relative;
    height:calc(100% - 50px);
    overflow:hidden;
}

.scroll-content{
    position:absolute;
    width:100%;

    display:flex;
    flex-direction:column;
    gap:10px;

    font-size:1rem;
    line-height:1.5;
    font-weight:600;

    animation:
    scrollUp 35s linear infinite;
}

.scroll-content div{
    background:rgba(255,255,255,0.12);

    padding:10px 12px;

    border-radius:12px;

    backdrop-filter:blur(3px);

    border-left:
    4px solid rgba(255,255,255,0.7);
}

/* SCROLL ANIMATION */
@keyframes scrollUp{

    0%{
        transform:translateY(100%);
    }

    100%{
        transform:translateY(-100%);
    }
}

/* BULLETIN */
#news-bar{
    height:8vh;

    display:flex;
    align-items:center;

    background:var(--gold);

    overflow:hidden;

    box-shadow:
    0 -4px 15px rgba(0,0,0,0.35);
}

/* LABEL */
.ticker-label{
    height:100%;

    background:var(--navy);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 28px;

    font-size:2rem;
    font-weight:900;
    letter-spacing:1px;

    box-shadow:
    4px 0 10px rgba(0,0,0,0.3);
}

/* MARQUEE */
.marquee-container{
    flex:1;
    overflow:hidden;
    position:relative;
}

.marquee{
    display:inline-block;

    white-space:nowrap;

    padding-left:100%;

    font-size:1.8rem;
    font-weight:800;

    color:#000;

    animation:
    scroll linear infinite;
}

@keyframes scroll{

    from{
        transform:translateX(0%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* MEDIA */

/* VIDEO: sized by JavaScript (fitVideo) so it fills the box with no black bars */
iframe{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border:none;
    pointer-events:none;
}

/* POSTER: "cover" fills the whole box, cropping edges if needed */
#slideshow{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border:none;
    transition:opacity 0.8s ease;
}

/* GLOW */
.primary-panel::before,
.secondary-panel::before{

    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at top right,
        rgba(255,255,255,0.18),
        transparent 45%
    );

    pointer-events:none;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>

<div class="header-brand-group">

<!-- GOOGLE DRIVE SCHOOL LOGO -->
<img
class="school-logo"

src="https://drive.google.com/thumbnail?id=1ypVlwlie0XIVA7naS4gsNAVxEu4BAzq4&sz=w1000"

alt="School Logo"
/>

<div class="school-name">

Invictus International School<br>

<span>
Horizon Hills
</span>

</div>

</div>

<!-- CLOCK -->
<div class="clock-container">

<div id="time">
00:00
</div>

<div id="date">
LOADING...
</div>

</div>

</header>

<!-- MAIN -->
<main>

<!-- LEFT -->
<div class="card poster-box">

<img
id="slideshow"
alt=""
src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
/>

</div>

<!-- RIGHT -->
<div class="right-col">

<!-- VIDEO -->
<div class="card video-box">

<iframe
id="yt-player"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

</div>

<!-- PANELS -->
<div class="bottom-split">

<!-- PRIMARY -->
<div class="info-panel primary-panel">

<div class="panel-header">

<h2>
PRIMARY
</h2>

<div class="panel-divider"></div>

</div>

<div class="scroll-container">

<div
id="campus-updates"
class="scroll-content">

Loading...

</div>

</div>

</div>

<!-- SECONDARY -->
<div class="info-panel secondary-panel">

<div class="panel-header">

<h2>
SECONDARY
</h2>

<div class="panel-divider"></div>

</div>

<div class="scroll-container">

<div
id="student-highlights"
class="scroll-content">

Loading...

</div>

</div>

</div>

</div>

</div>

</main>

<!-- BULLETIN -->
<div id="news-bar">

<div class="ticker-label">
BULLETIN
</div>

<div class="marquee-container">

<div
id="marquee-text"
class="marquee">

Loading...

</div>

</div>

</div>

<script>

/* ============================
   SETTINGS (easy to change)
   ============================ */

/* Your Apps Script web app link */
var API_URL =
"https://script.google.com/macros/s/AKfycbyhWqhhzjiNfNCLPSPmltgmNH4jkIXJ6PvMfLZtkG079rzBNiYWHhowQrWQeIOweedC/exec";

/* How often to check for new content (milliseconds) */
var REFRESH_MS = 20000;      /* 20 seconds */

/* Seconds each poster is shown */
var SLIDE_MS = 5000;         /* 5 seconds */

/* Video zoom: 1 = exact fit, bigger = crops more of YouTube's title bar and logo */
var VIDEO_ZOOM = 1.12;


/* ============================
   HELPERS
   ============================ */

/* Stops special characters in the sheet from breaking the page */
function esc(s){
    return String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* ============================
   CLOCK
   ============================ */
function clock(){

    var now = new Date();

    document.getElementById("time").innerText =
    now.toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    });

    document.getElementById("date").innerText =
    now.toLocaleDateString([],{
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    });
}


/* ============================
   VIDEO FILL (no black bars)
   ============================ */
function fitVideo(){

    var box    = document.querySelector(".video-box");
    var player = document.getElementById("yt-player");

    /* Video is 16:9. Scale it up until it covers the whole box. */
    var scale = Math.max(
        box.clientWidth  / 16,
        box.clientHeight / 9
    ) * VIDEO_ZOOM;

    player.style.width  = (scale * 16) + "px";
    player.style.height = (scale * 9)  + "px";
}


/* ============================
   POSTER SLIDESHOW
   ============================ */
var slideshowInterval = null;
var currentImages = "";      /* remembers the list so we only restart if it changed */

function updateImages(images){

    if(!images || !images.length) return;

    var key = images.join("|");
    if(key === currentImages) return;     /* nothing changed, keep playing */
    currentImages = key;

    var img = document.getElementById("slideshow");
    var i = 0;

    /* Preload so changes are smooth */
    images.forEach(function(src){
        var p = new Image();
        p.src = src;
    });

    /* If a picture fails to load, skip to the next one */
    img.onerror = function(){
        if(images.length > 1){
            i = (i + 1) % images.length;
            img.src = images[i];
        }
    };

    img.style.opacity = 1;
    img.src = images[0];

    clearInterval(slideshowInterval);

    slideshowInterval = setInterval(function(){

        i = (i + 1) % images.length;

        /* FADE OUT */
        img.style.opacity = 0;

        setTimeout(function(){
            img.src = images[i];
            /* FADE IN */
            img.style.opacity = 1;
        }, 400);

    }, SLIDE_MS);
}


/* ============================
   TEXT PANELS + BULLETIN
   ============================ */
function updateText(data){

    /* PRIMARY */
    var notices =
    (data.notices && data.notices.length)
    ? data.notices
    : ["No updates"];

    document.getElementById("campus-updates").innerHTML =
    notices.map(function(n){
        return "<div>▶ " + esc(n) + "</div>";
    }).join("");

    /* SECONDARY */
    var highlights =
    (data.highlights && data.highlights.length)
    ? data.highlights
    : ["No highlights"];

    document.getElementById("student-highlights").innerHTML =
    highlights.map(function(h){
        return "<div>★ " + esc(h) + "</div>";
    }).join("");

    /* BULLETIN */
    var el = document.getElementById("marquee-text");

    var text =
    data.bulletin ||
    "Welcome to Invictus International School";

    /* Only touch the ticker if the text changed, so it doesn't jump */
    if(el.innerText !== text){

        el.innerText = text;

        /* Auto speed: longer text scrolls for longer */
        var speed = Math.max(15, text.length * 0.35);
        el.style.animationDuration = speed + "s";
    }
}


/* ============================
   YOUTUBE
   ============================ */
var currentVideos = "";

function updateVideos(videos){

    if(!videos || !videos.length) return;

    var key = videos.join(",");
    if(key === currentVideos) return;     /* same list, don't reload the video */
    currentVideos = key;

    var player = document.getElementById("yt-player");

    player.src =
    "https://www.youtube.com/embed/" + videos[0] +
    "?autoplay=1&mute=0&controls=0&rel=0&loop=1" +
    "&playlist=" + key +
    "&modestbranding=1&iv_load_policy=3&disablekb=1&playsinline=1";

    fitVideo();
}


/* ============================
   LOAD EVERYTHING (one request)
   ============================ */
function loadData(){

    fetch(API_URL)
    .then(function(res){ return res.json(); })
    .then(function(data){

        if(data.error){
            console.log("Script error:", data.error);
            return;
        }

        updateText(data);
        updateImages(data.images);
        updateVideos(data.videos);
    })
    .catch(function(e){
        console.log("Load error", e);
    });
}


/* ============================
   START
   ============================ */
clock();
setInterval(clock, 1000);

fitVideo();
window.addEventListener("resize", fitVideo);

loadData();
setInterval(loadData, REFRESH_MS);

</script>

</body>
</html>
